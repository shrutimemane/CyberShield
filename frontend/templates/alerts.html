{% extends "base.html" %}
{% block title %}Alerts{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-between flex-wrap mb-4 gap-2">
  <div>
    <h4 class="mb-0">Security Alerts</h4>
    <span class="text-cs-muted small">Generated by the rule-based detection engine</span>
  </div>
  <div class="d-flex gap-2">
    <button id="btn-csv" class="btn btn-outline-cs btn-sm" title="Download all alerts as CSV"><i class="bi bi-filetype-csv"></i> Export CSV</button>
    <button id="btn-refresh" class="btn btn-outline-cs btn-sm"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
  </div>
</div>

<div class="row g-3 mb-3">
  <div class="col-md-3">
    <label class="form-label small text-cs-muted">STATUS</label>
    <select id="f-status" class="form-select form-select-sm">
      <option value="all">All statuses</option>
      <option value="NEW">New</option>
      <option value="ACKNOWLEDGED">Acknowledged</option>
      <option value="RESOLVED">Resolved</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small text-cs-muted">SEVERITY</label>
    <select id="f-severity" class="form-select form-select-sm">
      <option value="all">All severities</option>
      <option>CRITICAL</option><option>HIGH</option>
      <option>MEDIUM</option><option>LOW</option>
    </select>
  </div>
  <div class="col-md-3">
    <label class="form-label small text-cs-muted">TYPE</label>
    <select id="f-type" class="form-select form-select-sm">
      <option value="all">All types</option>
      <option value="PORT_SCAN">Port scan</option>
      <option value="EXCESSIVE_CONNECTIONS">Excessive connections</option>
      <option value="TRAFFIC_ANOMALY">Traffic anomaly (DoS-like)</option>
      <option value="SUSPICIOUS_IP">Suspicious IP</option>
    </select>
  </div>
  <div class="col-md-3 d-flex align-items-end">
    <button id="btn-apply" class="btn btn-cs btn-sm w-100"><i class="bi bi-funnel"></i> Apply Filters</button>
  </div>
</div>

<div class="cs-card">
  <div class="table-responsive">
    <table class="table table-dark-cs table-hover align-middle">
      <thead>
        <tr>
          <th>Time</th><th>Severity</th><th>Type</th><th>Source IP</th>
          <th>Destination</th><th>Reason</th><th>Status</th><th>Incident</th><th>Actions</th>
        </tr>
      </thead>
      <tbody id="alerts-body">
        <tr><td colspan="9" class="cs-empty">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/alerts.js') }}"></script>
{% endblock %}
